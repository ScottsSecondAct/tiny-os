name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Verify — run tests before releasing
  # ---------------------------------------------------------------------------
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-aarch64

      - name: Install Rust toolchain
        run: rustup show

      - name: Add x86_64 target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Host tests (51 tests)
        run: cargo test -p host-tests --target x86_64-unknown-linux-gnu

      - name: Build all 6 configurations
        run: |
          echo "--- qemu ---"
          cargo build --release --no-default-features --features kernel/bsp-qemu
          echo "--- qemu + safety-critical ---"
          cargo build --release --no-default-features --features kernel/bsp-qemu,kernel/safety-critical
          echo "--- qemu + dynamic-load ---"
          cargo build --release --no-default-features --features kernel/bsp-qemu,kernel/dynamic-load
          echo "--- rpi5 ---"
          cargo build --release
          echo "--- rpi5 + safety-critical ---"
          cargo build --release --no-default-features --features kernel/bsp-rpi5,kernel/safety-critical
          echo "--- rpi5 + dynamic-load ---"
          cargo build --release --no-default-features --features kernel/bsp-rpi5,kernel/dynamic-load
          echo "All 6 configurations built successfully."

      - name: QEMU boot test
        run: |
          cargo build --release --no-default-features --features kernel/bsp-qemu
          timeout 15 qemu-system-aarch64 \
            -M raspi4b -smp 4 \
            -kernel target/aarch64-unknown-none/release/kernel \
            -serial stdio -display none -no-reboot \
          | tee /tmp/qemu-output.txt || true
          grep -qi "tiny_os" /tmp/qemu-output.txt
          grep -qi "tiny_os>" /tmp/qemu-output.txt
          ! grep -qi "panic" /tmp/qemu-output.txt
          echo "QEMU boot test passed."

  # ---------------------------------------------------------------------------
  # Build kernel8.img for Raspberry Pi 5
  # ---------------------------------------------------------------------------
  build:
    name: Build kernel8.img
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install Rust toolchain
        run: rustup show

      - name: Install cargo-binutils
        run: cargo install cargo-binutils

      - name: Build (Pi 5)
        run: cargo build --release

      - name: Verify _start at 0x80000
        run: |
          aarch64-linux-gnu-nm target/aarch64-unknown-none/release/kernel \
            | grep _start | grep -q "0000000000080000"

      - name: Produce kernel8.img
        run: |
          cargo objcopy --release -- -O binary kernel8.img
          ls -lh kernel8.img

      - name: Generate SHA256 checksum
        run: sha256sum kernel8.img config.txt > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            kernel8.img
            config.txt
            SHA256SUMS.txt

  # ---------------------------------------------------------------------------
  # Create GitHub Release and attach assets
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/kernel8.img
            artifacts/config.txt
            artifacts/SHA256SUMS.txt
